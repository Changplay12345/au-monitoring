<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AU Spark Importer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header svg {
      color: #d97706;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #92400e;
    }
    .status {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
    }
    .status-value.success {
      color: #059669;
    }
    .status-value.pending {
      color: #d97706;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .btn-secondary {
      background: white;
      color: #4b5563;
      border: 1px solid #e5e7eb;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #f9fafb;
    }
    .instructions {
      margin-top: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.6);
      border-radius: 10px;
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .instructions strong {
      color: #374151;
    }
    .instructions ol {
      margin-left: 16px;
      margin-top: 8px;
    }
    .instructions li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
    </svg>
    <h1>AU Spark Importer</h1>
  </div>

  <div class="status">
    <div class="status-label">Last Import</div>
    <div class="status-value" id="status">No transcript imported yet</div>
  </div>

  <button class="btn btn-primary" id="openAuSpark">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </svg>
    Open AU Spark
  </button>

  <button class="btn btn-secondary" id="goToCrossChecker">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"></path>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
    </svg>
    Go to Cross Checker
  </button>

  <div class="instructions">
    <strong>How to use:</strong>
    <ol>
      <li>Click "Open AU Spark" above</li>
      <li>Login with your university Microsoft account</li>
      <li>Navigate to your grades/transcript page</li>
      <li>Click the orange "Import" button on the page</li>
      <li>Return to Cross Checker - data will be loaded!</li>
    </ol>
  </div>

  <script src="popup.js"></script>
</body>
</html>
